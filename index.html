<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umeå - Meet our team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <a class="logo" href="#home" aria-label="Umeå home">
            <img src="img/logo.png" alt="Umeå">
        </a>
        <nav class="menu" aria-label="Main menu">
            <a class="active" href="#home">Home</a>
            <a href="#shipping">Shop</a>
            <a href="#team">Blog</a>
            <a href="#team">Category</a>
            <a href="#team">About</a>
        </nav>
        <a class="contact-link" href="#contact">Contact Us</a>
    </header>

    <main id="home">
        <a class="hero-link" href="#team" aria-label="Meet our team">
            <img class="hero" src="img/banner.jpg" alt="A bright living room">
        </a>

        <section class="team section-width" id="team">
            <p class="eyebrow">OUR CREATIVE FORCE</p>
            <h1><a href="#team">Meet our team</a></h1>
            <div class="team-grid">
                <article class="member">
                    <a class="member-image" href="#contact"><img src="img/member1.jpg" alt="Yeung Ngai"></a>
                    <h2><a href="#contact">Yeung Ngai</a></h2>
                    <p>DESIGNER</p>
                </article>
                <article class="member">
                    <a class="member-image" href="#contact"><img src="img/member2.jpg" alt="Nicolas Waldau"></a>
                    <h2><a href="#contact">Nicolas Waldau</a></h2>
                    <p>ARCHITECT</p>
                </article>
                <article class="member">
                    <a class="member-image" href="#contact"><img src="img/member3.jpg" alt="Juliette Massé"></a>
                    <h2><a href="#contact">Juliette Massé</a></h2>
                    <p>STORE MANAGER</p>
                </article>
                <article class="member">
                    <a class="member-image" href="#contact"><img src="img/member4.jpg" alt="Nicolette Ritonni"></a>
                    <h2><a href="#contact">Nicolette Ritonni</a></h2>
                    <p>FINE CERAMICS</p>
                </article>
            </div>
        </section>

        <section class="shipping section-width" id="shipping">
            <p class="eyebrow">ORDER YOUR ITEMS ONLINE</p>
            <h2><a href="#contact">Worldwide shipping available</a></h2>
            <a class="shipping-image" href="#contact">
                <img src="img/banner2.jpg" alt="A bright kitchen with natural wood details">
            </a>
        </section>
    </main>

    <footer class="footer section-width" id="contact">
        <a class="footer-logo" href="#home"><img src="img/logo.png" alt="Umeå"></a>
        <form id="email-form" class="email-form" novalidate>
            <label class="visually-hidden" for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="Enter email address...">
            <button type="submit">Contact Us</button>
        </form>
    </footer>
    <script>
        document.getElementById("email-form").addEventListener("submit", function (event) {
            event.preventDefault();
            const email = document.getElementById("email");
            if (email.value.trim() === "" || !email.validity.valid) {
                alert("Please enter a valid email address.");
                email.focus();
                return;
            }
            alert("Thank you!");
            email.value = "";
        });
    </script>
</body>
</html>
